name: Django CI

on: [push, pull_request]

env:
  SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
  ANOTHER_VAR: value

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Display Python version (lint)
        run: python --version

      - name: Install Poetry
        run: pip install poetry

      - name: Display Poetry Version (lint)
        run: poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false
          #poetry config cache-dir /tmp/poetry_cache # Explicit cache directory to avoid permission issues (Optional)

      - name: Clear Poetry Cache
        run: rm -rf $(poetry config cache-dir) || true

      - name: Remove poetry.lock (lint)
        run: rm -f poetry.lock || true

      - name: Install Dependencies (lint)
        run: poetry install --with dev --no-interaction

      - name: Check Python (lint)
        run: python --version

      - name: List Installed Packages (lint)
        run: poetry show

      - name: Run flake8
        run: poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Display Python version (test)
        run: python --version

      - name: Install Poetry
        run: pip install poetry

      - name: Display Poetry Version (test)
        run: poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false
          poetry config virtualenvs.in-project true # Ensure virtualenv is created in project

      - name: Clear Poetry Cache
        run: rm -rf $(poetry config cache-dir) || true

      - name: Remove poetry.lock (test)
        run: rm -f poetry.lock || true

      - name: Install Dependencies (test)
        run: poetry install --no-interaction

      - name: Activate Poetry Environment (Crucial!)
        run: |
          echo "::add-path::$(pwd)/.venv/bin"

      - name: Check Python (test)
        run: python --version

      - name: List Installed Packages (test)
        run: poetry show

      - name: Run Tests
        run: poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/online_work:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/online_work:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/online_work:${{ github.sha }}
          docker stop online_work || true
          docker rm online_work || true
          docker run -d --name online_work -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/online_work:${{ github.sha }}
          EOF
