version: '3.9'

services:
  db:
    image: postgres:14
    container_name: db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.2.5
    container_name: my-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: .
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - REDIS_URL=redis://my-redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
    volumes:
      - .:/app
    restart: always

  celery:
    build: .
    container_name: celery
    command: celery -A config worker -l info
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - CELERY_BROKER_URL=redis://my-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://my-redis:6379/0
    volumes:
      - .:/app
    restart: always

  celerybeat:
    build: .
    container_name: celerybeat
    command: celery -A config beat -l info
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - CELERY_BROKER_URL=redis://my-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://my-redis:6379/0
    volumes:
      - .:/app
    restart: always

volumes:
  postgres_data:
